<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Автомастерская</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Автомастерская "АвтоПрофи"</h1>
        <nav>
            <ul>
                <li><a href="#services">Услуги</a></li>
                <li><a href="#about">О нас</a></li>
                <li><a href="#contact">Контакты</a></li>
            </ul>
        </nav>
    </header>
    <section id="services">
        <h2>Наши услуги</h2>
        <ul>
            <li>Диагностика</li>
            <li>Ремонт двигателя</li>
            <li>Замена масла</li>
        </ul>
    </section>
    <section id="about">
        <h2>О нас</h2>
        <p>Мы предлагаем качественный ремонт и обслуживание автомобилей с гарантией.</p>
    </section>
    <section id="contact">
        <h2>Контакты</h2>
        <form id="contactForm">
            <input type="text" placeholder="Ваше имя" required>
            <input type="email" placeholder="Email" required>
            <textarea placeholder="Сообщение"></textarea>
            <button type="submit">Отправить</button>
        </form>
    </section>
    <footer>
        <p>© 2025 Автомастерская "АвтоПрофи"</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
