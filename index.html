<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>Авто КОМЕК</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header>
        <img src="images/logo.png" alt="Логотип Авто КОМЕК" class="logo" />
        <h1>Авто КОМЕК</h1>
        <p>Город: Астана</p>
    </header>

    <main>
        <section class="hero">
            <img src="images/car_background.jpg" alt="Автомобиль" class="background-img" />
            <div class="hero-text">
                <h2>Добро пожаловать в Авто КОМЕК</h2>
                <p>Надежный ремонт и диагностика автомобилей</p>
            </div>
        </section>

        <section class="price-list">
            <h3>Прайс-лист</h3>
            <ul>
                <li>Диагностика ходовой — от 5000 тг</li>
                <li>Замена масла — от 10 000 тг</li>
                <li>Услуги электрика — от 3000 тг</li>
            </ul>
        </section>

        <section class="contact-form">
            <h3>Связаться с нами</h3>
            <form id="contactForm">
                <label>Имя:<br /><input type="text" name="name" required /></label><br />
                <label>Email:<br /><input type="email" name="email" required /></label><br />
                <label>Сообщение:<br /><textarea name="message" required></textarea></label><br />
                <button type="submit">Отправить</button>
            </form>
            <p id="formMessage" class="form-message"></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Авто КОМЕК</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
